name: Demo

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build the demo app for the simulator
        run: >
          xcodebuild build
          -project demo/ApplePayDemo.xcodeproj
          -scheme ApplePayDemo
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
